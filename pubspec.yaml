name: smart_split_bill
description: BagiTigaKan (÷ split_fairly(n)) - Aplikasi Smart Split-Bill & Patungan Grup - Proyek Akhir Pemrograman Mobile (Dart & Flutter SDK).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management (BLoC / Cubit) & Routing (Auth Guard)
  flutter_bloc: ^8.1.6
  go_router: ^14.3.0
  # Open-Source API (Frankfurter v2 & OCR JSON) & Formatting
  http: ^1.2.2
  intl: ^0.19.0
  # Firebase Backend (Auth + Cloud Firestore) & Local Preferences
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
