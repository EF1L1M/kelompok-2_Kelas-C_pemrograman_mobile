name: smart_split_bill
description: Aplikasi Smart Split-Bill & Budget - Proyek Akhir Pemrograman Mobile (Dart & Flutter SDK).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management (BLoC / Cubit) & Routing (Auth Guard)
  flutter_bloc: ^8.1.6
  go_router: ^14.3.0
  # Open-Source API (Frankfurter v2 & OCR JSON) & Formatting
  http: ^1.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
